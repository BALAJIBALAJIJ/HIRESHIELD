spring:
  application:
    name: hireshield-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/hireshield}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:hireshield-default-secret-key-change-in-production-min-256-bits-long}
  expiration: ${JWT_EXPIRATION:86400000}

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging:
  level:
    com.hireshield: DEBUG
    org.springframework.security: INFO
